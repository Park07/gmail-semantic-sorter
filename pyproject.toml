[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-semantic-sorter"
version = "0.1.0"
description = "Local category discovery and add-only labels for a personal Gmail inbox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.150,<3",
  "google-auth-oauthlib>=1.2,<2",
  "numpy>=1.26,<3",
  "scikit-learn>=1.3,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "build>=1,<2"]

[project.scripts]
gmail-sorter = "sorter.cli:main"

[tool.setuptools.packages.find]
include = ["sorter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
